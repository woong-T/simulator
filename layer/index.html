<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지층 생성 시뮬레이터</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1>지층 생성과 지사학의 법칙</h1>
      <p>중학생을 위해 만든 지층 퇴적, 관입, 침식, 부정합 개념 시뮬레이터입니다.</p>
    </header>

    <section class="panel">
      <div class="controls">
        <button id="depositBtn">퇴적</button>
        <button id="intrudeBtn">관입</button>
        <button id="erodeBtn">침식</button>
        <button id="resetBtn">초기화</button>
      </div>

      <div class="simulator">
        <div class="layer-area" id="layerArea">
          <div class="ground-label">지표면</div>
        </div>
        <div class="legend">
          <strong>설명</strong>
          <p>위 버튼을 눌러 지층을 쌓고, 관입과 침식을 체험해 보세요.</p>
        </div>
      </div>
    </section>

    <section class="panel quiz-panel">
      <h2>문제 모드: 생성 순서 맞히기</h2>
      <p>아래 이벤트를 일어난 순서대로 1부터 4까지 선택하세요.</p>
      <div class="quiz-card">
        <div class="quiz-row">
          <span>① 수평퇴적</span>
          <select class="quiz-select" data-answer="1">
            <option value="">선택</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </div>
        <div class="quiz-row">
          <span>② 관입</span>
          <select class="quiz-select" data-answer="2">
            <option value="">선택</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </div>
        <div class="quiz-row">
          <span>③ 침식</span>
          <select class="quiz-select" data-answer="3">
            <option value="">선택</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </div>
        <div class="quiz-row">
          <span>④ 부정합</span>
          <select class="quiz-select" data-answer="4">
            <option value="">선택</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </div>
      </div>
      <div class="quiz-actions">
        <button id="checkBtn">정답 확인</button>
      </div>
      <div class="explanation" id="explanation">
        <p>정답을 확인하면 지사학 법칙과 함께 해설이 표시됩니다.</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
